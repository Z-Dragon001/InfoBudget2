project:
  name: "InfoBudget"
  seed: 42
  output_dir: "./outputs"

dataset:
  root_dir: "./datasets"
  raw_dir: "./datasets/raw"
  processed_dir: "./datasets/processed"
  supported_datasets: ["locomo", "longmemeval"]
  default_splits: ["train", "dev", "test"]
  fallback_split_name: "full"
  store_flat_questions: true
  store_flat_sessions: true
  store_flat_turns: true
  schema_version: "processed_v3"

segmentation:
  # nsp_text_tiling | bert_mlp_text_tiling
  method: "nsp_text_tiling"
  preserve_session_boundaries: true
  bert_model_dir: "./seg_models/bert-base-uncased"
  bert_mlp_checkpoint: "./seg_models/bert_mlp/best.pt"
  bert_max_length: 128
  bert_batch_size: 16
  adaptive_alpha: 0.5
  bert_mlp_activation: "relu"
  min_boundary_gap: 1
  min_segment_turns: 2
  min_segment_tokens: 20
  max_segment_turns: 12
  max_segment_tokens: 768
  merge_short_segment: true
  trace_enabled: true
