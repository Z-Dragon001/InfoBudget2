schema_version: "rl_router_v1"
seed: 42

prompts:
  fact_extraction: "joint_memory_extraction.txt"
  locomo_answer: "locomo_answer.txt"
  longmemeval_answer: "longmemeval_answer.txt"
  locomo_judge: "judge_locomo.txt"
  longmemeval_single_session_judge: "judge_longmemeval_single_session.txt"
  longmemeval_temporal_reasoning_judge: "judge_longmemeval_temporal_reasoning.txt"
  longmemeval_knowledge_update_judge: "judge_longmemeval_knowledge_update.txt"
  longmemeval_preference_judge: "judge_longmemeval_preference.txt"
  longmemeval_abstention_judge: "judge_longmemeval_abstention.txt"
  longmemeval_exact_match_judge: "judge_longmemeval_exact_match.txt"

extraction:
  max_facts_per_segment: 15
  reserve_output_tokens_per_segment: 1024
  allow_oversize_singleton: true
  schema_repair_max_attempts: 2
  require_provider_usage: true
  flush_at_sample_end: true
  allow_cross_sample_batch: false
  truncate_over_total_context: true
  quality_gates:
    max_empty_fact_segment_rate: 0.25
    max_saturated_segment_rate: 0.10
    max_repair_batch_rate: 0.20
    max_failed_batch_rate: 0.0
  buffers:
    small: &buffer
      max_segments: 6
      max_input_tokens: 16384
      max_total_context_tokens: 24576
    medium:
      <<: *buffer
    large:
      <<: *buffer

api_reliability:
  timeout_seconds: 300
  max_retries: 4
  retry_backoff_seconds: 1.0

storage:
  mode: "server"
  url: "http://127.0.0.1:6333"
  grpc_port: 6334
  prefer_grpc: false
  timeout_seconds: 30
  api_key_env: ""
  collection_namespace: "{dataset}_{split}_{segmentation_version}_{embedding_hash}_fact_v2"
  vector_size: 1024
  distance: "Cosine"
  require_sample_filter: true
  require_assembly_filter_for_s: true

router:
  type: "embedding_mlp"
  algorithm: "actor_critic_lagrangian"
  actions: ["small", "medium", "large"]
  hidden_dimensions: [512, 128]
  dropout: 0.1
  budget: 0.5
  learning_rate: 0.0003
  lambda_learning_rate: 0.01
  gamma: 1.0

evaluation:
  retrieval_top_k: 20
  objective_cost_scope: "memory_extraction_only"
  reader_max_new_tokens: 256
  judge_max_new_tokens: 128
  judge_temperature: 0.0
