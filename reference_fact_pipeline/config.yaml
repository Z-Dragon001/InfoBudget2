schema_version: "frozen_reference_fact_v1"
prompt_version: "reference_fact_prompt_v3_canonical_ids_json_repair"

models:
  # These roles are resolved from configs/models.yaml.
  reference_extractor_role: "gold_fact_extractor"
  coverage_extractor_role: "gold_fact_extractor"
  grounding_judge_role: "judge_llm"
  candidate_roles: ["small", "medium", "large"]
  require_non_candidate_reference_model: true

limits:
  # Must equal the candidate extractor's maximum Facts per topic segment.
  max_reference_facts: 15
  max_raw_facts: 45
  extraction_max_new_tokens: 4096
  coverage_max_new_tokens: 4096
  grounding_max_new_tokens: 4096

api:
  timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 1.0
  # Applied only to Gold extraction requests sent to Cloudflare Responses.
  cloudflare_request_interval_seconds: 3.0
  # Applied only to HTTP 402 responses containing "Wholesale rate limit exceeded".
  cloudflare_402_backoff_seconds: [60, 120, 300]
  # After all request-level 402 retries fail, pause and retry the same segment.
  cloudflare_circuit_pause_seconds: 300
  cloudflare_max_auto_resumes: 2

ranking:
  # Used only if more than K grounded Facts remain. Source order breaks ties.
  fact_type_priority:
    - state
    - event
    - knowledge
    - relationship
    - plan
    - decision
    - constraint
    - identity
    - preference
    - goal
    - health
    - negative
    - assistant_answer
    - other
