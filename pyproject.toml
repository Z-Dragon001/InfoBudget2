[project]
name = "infobudget"
version = "0.1.0"
description = "Budget-aware long-term memory extraction pipeline for LLM agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "qdrant-client>=1.15,<1.17",
  "huggingface-hub>=0.36",
  "sentence-transformers>=3.0",
  "torch>=2.0",
  "transformers>=4.40",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
